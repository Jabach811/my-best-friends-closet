<!DOCTYPE html>
<!--
  INSTAGRAM STRIP — standalone preview.

  To swap in real photos:
    1. Drop 9 images into  assets/instagram/  named 01.jpg … 09.jpg
    2. Edit the POSTS list at the bottom of this file (caption + link per tile)

  To go live-updating later, replace the POSTS list with a feed service
  (Behold / Curator / LightWidget). The markup and CSS stay exactly the same.

  To paste into index.html: copy the <section class="ig"> block and the
  <style> block, drop the section just above <footer class="site-footer">.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram strip — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@300..700&family=Inter+Tight:wght@200..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<style>
.ig {
  padding: clamp(3.5rem, 7vw, 5.5rem) clamp(1.25rem, 4vw, 3rem);
  border-top: 1px solid var(--line);
  background: var(--ivory);
}
.ig-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem 2rem;
  max-width: 1200px;
  margin: 0 auto 2rem;
}
.ig-head h2 { font-size: clamp(1.6rem, 3.2vw, 2.2rem); }
.ig-head h2 span { font-style: italic; color: var(--teal-deep); }
.ig-meta {
  font-size: 0.9375rem;
  color: var(--ink-soft);
}
.ig-meta a { color: var(--teal-deep); }

.ig-live {
  max-width: 1200px;
  margin: 0 auto 1.75rem;
  padding: 0.9rem 1.1rem;
  background: var(--cream);
  border-left: 3px solid var(--teal);
  font-size: 0.9375rem;
}
.ig-live strong { font-weight: 700; }
.ig-live em { font-style: normal; color: var(--ink-soft); }

.ig-grid {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
  list-style: none;
}
@media (min-width: 700px)  { .ig-grid { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 1000px) { .ig-grid { grid-template-columns: repeat(9, 1fr); gap: 0.6rem; } }

.ig-grid a {
  position: relative;
  display: block;
  aspect-ratio: 1;
  overflow: hidden;
  background: var(--cream);
  text-decoration: none;
}
.ig-grid img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 400ms ease;
}
@media (prefers-reduced-motion: reduce) { .ig-grid img { transition: none; } }
.ig-grid a:hover img { transform: scale(1.05); }

/* caption shows on hover, and always on the fallback tiles */
.ig-cap {
  position: absolute;
  inset: auto 0 0 0;
  padding: 1.6rem 0.6rem 0.55rem;
  font-size: 0.75rem;
  line-height: 1.3;
  color: #fff;
  background: linear-gradient(transparent, rgba(35,37,28,0.78));
  opacity: 0;
  transition: opacity 250ms ease;
}
.ig-grid a:hover .ig-cap,
.ig-grid a:focus-visible .ig-cap { opacity: 1; }

.ig-grid a.is-empty {
  display: grid;
  place-items: center;
  padding: 0.6rem;
  border: 1px solid var(--line);
}
.ig-grid a.is-empty .ig-cap {
  position: static;
  opacity: 1;
  color: var(--ink-soft);
  background: none;
  padding: 0;
  text-align: center;
  font-family: var(--serif);
  font-style: italic;
  font-size: 0.8125rem;
}

.ig-foot {
  max-width: 1200px;
  margin: 1.75rem auto 0;
  text-align: center;
}
</style>
</head>
<body>

<!-- ============ PASTE FROM HERE ============ -->
<section class="ig" id="instagram" aria-labelledby="ig-title">

  <div class="ig-head">
    <h2 id="ig-title">Straight from the floor <span>@mbfctracy</span></h2>
    <p class="ig-meta">11K following along on <a href="https://www.instagram.com/mbfctracy/" target="_blank" rel="noopener">Instagram</a></p>
  </div>

  <p class="ig-live">
    <strong>Live sales every week</strong> — Wednesday 4pm · Thursday 6pm · Saturday 9am.
    <em>Watch on Instagram, or come see it in person the next day.</em>
  </p>

  <ul class="ig-grid" id="ig-grid"></ul>

  <p class="ig-foot">
    <a class="btn" href="https://www.instagram.com/mbfctracy/" target="_blank" rel="noopener">Follow @mbfctracy</a>
  </p>

</section>

<script>
/* The nine most recent posts from @mbfctracy, captured by hand.
   Any tile whose image is missing falls back to a caption card, so the strip
   never shows a broken picture during the demo. */
const POSTS = [
  { img: "assets/instagram/01.jpg", caption: "Celebrating out front",              href: "https://www.instagram.com/mbfctracy/p/DWNBgwWkrej/" },
  { img: "assets/instagram/02.jpg", caption: "Arm-wrestling over a brand-new dress", href: "https://www.instagram.com/mbfctracy/reel/DaVrW5aMq2y/" },
  { img: "assets/instagram/03.jpg", caption: "Come to work with Shawna",           href: "https://www.instagram.com/mbfctracy/reel/DaEYtzrP8NC/" },
  { img: "assets/instagram/04.jpg", caption: "Asking Liz rapid-fire questions",    href: "https://www.instagram.com/mbfctracy/reel/Db6oXgABDra/" },
  { img: "assets/instagram/05.jpg", caption: "Louis Vuitton OnTheGo GM tote",      href: "https://www.instagram.com/mbfctracy/reel/Db6ZoGXB56Q/" },
  { img: "assets/instagram/06.jpg", caption: "Colby monk dress, back in stock",    href: "https://www.instagram.com/mbfctracy/reel/Db1jPxKBzPL/" },
  { img: "assets/instagram/07.jpg", caption: "Unboxing fall",                      href: "https://www.instagram.com/mbfctracy/reel/Dby84o3hpv8/" },
  { img: "assets/instagram/08.jpg", caption: "New handbags on the shelf",          href: "https://www.instagram.com/mbfctracy/p/DbtrPl6koM3/" },
  { img: "assets/instagram/09.jpg", caption: "Huge vintage Coach drop",            href: "https://www.instagram.com/mbfctracy/reel/DboyNZePyvF/" },
];

document.getElementById("ig-grid").innerHTML = POSTS.map(p => `
  <li>
    <a href="${p.href}" target="_blank" rel="noopener" aria-label="${p.caption} — view on Instagram">
      <img src="${p.img}" alt="" loading="lazy" decoding="async"
           onerror="this.closest('a').classList.add('is-empty'); this.remove();">
      <span class="ig-cap">${p.caption}</span>
    </a>
  </li>`).join("");
</script>
<!-- ============ PASTE TO HERE ============ -->

</body>
</html>
